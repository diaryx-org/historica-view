[package]
name = "historica-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A browser view of a Historica store's history"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/historica-view"
publish = false

[lib]
# `cdylib` is the module the page loads; `rlib` is what `cargo test` links, so
# every answer the page shows can be asked for natively first.
crate-type = ["cdylib", "rlib"]

[dependencies]
# A registry version and no path, as historica-git has it: the view reaches
# what historica published and nothing else. `disk` is off because a browser
# has no disk; the store is handed its files in memory.
historica = { version = "1.0.0-rc.8", default-features = false }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2"
# Must match the `wasm-bindgen` CLI that generates the bindings, exactly.
wasm-bindgen = "=0.2.127"

# historica reaches getrandom for `record`, which the view never calls, but a
# freestanding wasm build refuses to compile without a backend chosen.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
# The tests record a history on disk with the library itself, then read it
# back through the in-memory folder the page uses.
historica = { version = "1.0.0-rc.8", features = ["disk"] }
