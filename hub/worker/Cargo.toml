[package]
name = "historica-hub-worker"
description = "The hub on Cloudflare: renders pages, serves published copies from R2, takes pushes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# README and task bodies come back from historica-view unsanitised; the worker
# sanitises them once, so the HTML it renders and the HTML the client renders
# from the same data are both safe.
ammonia = "4.1"
console_error_panic_hook = "0.1"
dioxus.workspace = true
dioxus-ssr.workspace = true
historica = { version = "1.0.0-rc.8", default-features = false }
historica-hub-app.workspace = true
historica-view.workspace = true
serde.workspace = true
serde_json.workspace = true
# A repository's history arrives as one archive: a Durable Object loading it
# as a thousand R2 objects would spend a thousand subrequests on one page.
tar = { version = "0.4", default-features = false }
# The `durable_object` macro names wasm-bindgen by its own path.
wasm-bindgen = "0.2"
worker = "0.8.7"
