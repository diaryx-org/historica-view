[package]
name = "historica-hub"
description = "Push a Historica repository to a hub: `historica hub push`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "historica-hub"
path = "src/main.rs"

[dependencies]
# A push key is typed without being shown.
rpassword = "7.5"
serde.workspace = true
serde_json.workspace = true
# Each file is sent once, by its digest, as the hub keeps it.
sha2 = "0.11"
# The store's `history/`, as the one archive the hub opens it from.
tar = { version = "0.4", default-features = false }
# Blocking HTTP is all a push needs, a few requests at once on threads. No gzip:
# the worker can answer an empty body marked as compressed, which ureq's
# decoder refuses.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
